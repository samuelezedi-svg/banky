<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NairaShield</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/shared.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="ns-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3 5 6.2v5.3c0 4.4 2.9 7.5 7 8.5 4.1-1 7-4.1 7-8.5V6.2L12 3Z" stroke="#E0B44A" stroke-width="1.6"/>
              <path d="m8.6 12.1 2.2 2.2 4.6-4.8" stroke="#1FA971" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <strong>NairaShield</strong>
            <span>Nigerian bank link guard</span>
          </div>
        </div>
        <a class="gear" href="../options/options.html" target="_blank" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 3.6v2.2M12 18.2v2.2M4.8 7.4l1.9 1.1M17.3 15.5l1.9 1.1M3.6 12h2.2M18.2 12h2.2M4.8 16.6l1.9-1.1M17.3 8.5l1.9-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>
      </header>

      <section class="verdict" id="verdict" data-level="idle">
        <div class="glow" aria-hidden="true"></div>
        <div class="shield" id="shield"></div>
        <p class="ns-kicker" id="kicker">Checking this tab</p>
        <h1 id="title">Scanning link…</h1>
        <p class="sub" id="subtitle">NairaShield is reviewing the current page.</p>
        <p class="ns-url" id="url"></p>
      </section>

      <section class="card" id="reasons-card">
        <p class="ns-kicker">Why this result</p>
        <ul id="reasons"></ul>
        <button class="ns-btn ns-btn-ghost report-btn" id="report" type="button">Report this site</button>
        <p class="report-status" id="report-status"></p>
      </section>

      <section class="card recent-card">
        <div class="recent-head">
          <p class="ns-kicker">Recent checks</p>
          <button class="text-btn" id="clear-recent" type="button">Clear</button>
        </div>
        <div id="recent" class="recent-list"></div>
      </section>
    </div>

    <script src="../lib/banks.js"></script>
    <script src="../lib/detect.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
